<title>PM資質診断</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

<style>
:root {
  --navy: #1B3B6F;
  --navy-mid: #2A5EA0;
  --navy-light: #E6EEF8;
  --accent: #C07A10;
  --accent-light: #FDF3E2;
  --bg: #F8F9FB;
  --surface: #FFFFFF;
  --surface2: #F3F6FB;
  --text: #1A2332;
  --text-muted: #5A6A80;
  --border: #D0DAE8;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1823;
    --surface: #1A2535;
    --surface2: #1F2E42;
    --text: #E8EEF6;
    --text-muted: #8A9AB5;
    --border: #2A3A52;
    --navy-light: #1A2E4A;
    --accent-light: #231A08;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1823;
  --surface: #1A2535;
  --surface2: #1F2E42;
  --text: #E8EEF6;
  --text-muted: #8A9AB5;
  --border: #2A3A52;
  --navy-light: #1A2E4A;
  --accent-light: #231A08;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans JP', sans-serif;
  background: var(--bg);
  color: var(--text);
  padding-inline: 16px;
  padding-block: 28px 64px;
  max-width: 680px;
  margin: 0 auto;
  line-height: 1.65;
}

/* ───── Header ───── */
.tool-header {
  background: var(--navy);
  border-radius: 14px;
  padding: 36px 28px 32px;
  text-align: center;
  color: #fff;
  margin-bottom: 24px;
}
.tool-eyebrow {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .13em;
  opacity: .65;
  margin-bottom: 10px;
  text-transform: uppercase;
}
.tool-title {
  font-family: 'Noto Serif JP', serif;
  font-size: 26px;
  font-weight: 700;
  margin-bottom: 10px;
  text-wrap: balance;
}
.tool-sub {
  font-size: 13px;
  opacity: .8;
  line-height: 1.7;
  max-width: 440px;
  margin: 0 auto;
}

/* ───── Legend ───── */
.legend-box {
  background: var(--accent-light);
  border: 1px solid rgba(192,122,16,.22);
  border-radius: 10px;
  padding: 14px 18px;
  margin-bottom: 24px;
}
.legend-title {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .08em;
  color: var(--accent);
  margin-bottom: 10px;
}
.legend-items {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 14px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12.5px;
}
.l-num {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--navy);
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

/* ───── Question Card ───── */
.q-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 10px;
  padding: 16px 18px;
}
.q-num {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .08em;
  color: var(--text-muted);
  margin-bottom: 6px;
}
.q-text {
  font-size: 14px;
  line-height: 1.65;
  margin-bottom: 12px;
  color: var(--text);
}

.radio-row {
  display: flex;
  gap: 6px;
}
.rlabel {
  flex: 1;
  cursor: pointer;
}
.rlabel input[type="radio"] { display: none; }
.rbtn {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 40px;
  border-radius: 7px;
  border: 2px solid var(--border);
  background: var(--surface2);
  font-size: 14px;
  font-weight: 700;
  color: var(--text-muted);
  transition: border-color .12s, background .12s, color .12s;
  user-select: none;
  -webkit-user-select: none;
}
.rlabel:hover .rbtn {
  border-color: var(--navy-mid);
  color: var(--navy-mid);
}
.rlabel input:checked + .rbtn {
  border-color: var(--navy);
  background: var(--navy);
  color: #fff;
}

.radio-ends {
  display: flex;
  justify-content: space-between;
  margin-top: 5px;
  font-size: 10px;
  color: var(--text-muted);
  opacity: .8;
}

/* ───── Progress ───── */
.progress-wrap {
  margin-bottom: 20px;
}
.progress-label {
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 6px;
  display: flex;
  justify-content: space-between;
}
.progress-bar-bg {
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  background: var(--navy-mid);
  border-radius: 2px;
  width: 0%;
  transition: width .3s ease;
}

/* ───── Submit ───── */
.submit-wrap {
  text-align: center;
  margin-top: 16px;
  margin-bottom: 40px;
}
.btn-go {
  background: var(--navy);
  color: #fff;
  border: none;
  border-radius: 10px;
  padding: 16px 56px;
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  letter-spacing: .04em;
  transition: background .14s, transform .1s;
}
.btn-go:hover { background: var(--navy-mid); }
.btn-go:active { transform: scale(.97); }
.err-msg {
  margin-top: 10px;
  font-size: 12.5px;
  color: #C0392B;
  display: none;
}

/* ───── Result ───── */
#result {
  animation: fadeUp .45s ease both;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}

.res-header {
  background: var(--navy);
  border-radius: 14px 14px 0 0;
  padding: 26px 24px 22px;
  text-align: center;
  color: #fff;
}
.res-eyebrow {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .12em;
  opacity: .65;
  margin-bottom: 6px;
}
.res-title {
  font-family: 'Noto Serif JP', serif;
  font-size: 20px;
  font-weight: 700;
}

.chart-area {
  background: var(--surface);
  border-left: 1px solid var(--border);
  border-right: 1px solid var(--border);
  padding: 28px 16px 20px;
  display: flex;
  justify-content: center;
}
.chart-area canvas {
  max-width: 380px;
  width: 100%;
}

.type-card {
  background: var(--accent-light);
  border: 1px solid rgba(192,122,16,.22);
  border-top: none;
  padding: 20px 22px;
}
.type-eyebrow {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .1em;
  color: var(--accent);
  margin-bottom: 6px;
}
.type-name {
  font-family: 'Noto Serif JP', serif;
  font-size: 20px;
  font-weight: 700;
  color: var(--navy);
  margin-bottom: 7px;
}
.type-desc {
  font-size: 13.5px;
  line-height: 1.75;
  color: var(--text);
}

.scores-section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-top: none;
  padding: 18px 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.score-row {
  display: flex;
  align-items: center;
  gap: 10px;
}
.s-badge {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.s-info { flex: 1; min-width: 0; }
.s-name { font-size: 12.5px; font-weight: 700; margin-bottom: 4px; color: var(--text); }
.s-bar-wrap {
  background: var(--surface2);
  border-radius: 3px;
  height: 7px;
  overflow: hidden;
}
.s-bar {
  height: 100%;
  border-radius: 3px;
  width: 0;
  transition: width 1.1s cubic-bezier(.4,0,.2,1);
}
.s-val {
  font-size: 14px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  min-width: 28px;
  text-align: right;
  color: var(--text);
}

.res-footer {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-top: none;
  border-radius: 0 0 14px 14px;
  padding: 16px 22px;
  text-align: center;
}
.res-note {
  font-size: 11.5px;
  color: var(--text-muted);
  line-height: 1.7;
  margin-bottom: 12px;
}
.btn-reset {
  background: transparent;
  border: 1.5px solid var(--border);
  border-radius: 7px;
  padding: 9px 24px;
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 13px;
  color: var(--text-muted);
  cursor: pointer;
  transition: border-color .12s, color .12s;
}
.btn-reset:hover { border-color: var(--navy); color: var(--navy); }

@media (max-width: 480px) {
  .tool-title { font-size: 22px; }
  .rbtn { height: 38px; font-size: 13px; }
  .radio-ends { font-size: 9px; }
  .legend-item { font-size: 11.5px; }
}
</style>

<div class="tool-header">
  <div class="tool-eyebrow">PMBOK × StrengthsFinder</div>
  <h1 class="tool-title">PM資質診断</h1>
  <p class="tool-sub">20の問いに答えて、PMとしてのあなたの「資質」を可視化しましょう。正解はありません。自分らしい傾向を正直に選んでください。</p>
</div>

<div class="legend-box">
  <div class="legend-title">回答基準</div>
  <div class="legend-items">
    <div class="legend-item"><div class="l-num">1</div>まったく当てはまらない</div>
    <div class="legend-item"><div class="l-num">2</div>あまり当てはまらない</div>
    <div class="legend-item"><div class="l-num">3</div>どちらともいえない</div>
    <div class="legend-item"><div class="l-num">4</div>よく当てはまる</div>
    <div class="legend-item"><div class="l-num">5</div>とても自分らしい</div>
  </div>
</div>

<div class="progress-wrap">
  <div class="progress-label">
    <span>回答の進捗</span>
    <span id="progressText">0 / 20</span>
  </div>
  <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
</div>

<div id="diagForm"></div>

<div class="submit-wrap">
  <button class="btn-go" id="btnDiagnose">診断する →</button>
  <div class="err-msg" id="errMsg"></div>
</div>

<div id="result" hidden>
  <div class="res-header">
    <div class="res-eyebrow">DIAGNOSIS RESULT</div>
    <div class="res-title">診断結果</div>
  </div>
  <div class="chart-area">
    <canvas id="radarChart"></canvas>
  </div>
  <div class="type-card">
    <div class="type-eyebrow">あなたのPMタイプ</div>
    <div class="type-name" id="typeName"></div>
    <div class="type-desc" id="typeDesc"></div>
  </div>
  <div class="scores-section" id="scoresList"></div>
  <div class="res-footer">
    <p class="res-note">スコアはPMBOK第6版の10知識エリアを5軸に集約したものです。<br>資質の高い軸があなたの自然な才能。チームでカバーし合いましょう。</p>
    <button class="btn-reset" id="btnReset">もう一度診断する</button>
  </div>
</div>

<script>
const AXES = {
  A: { name: 'ゴール設定力',      areas: '統合マネジメント × スコープマネジメント',           color: '#1B3B6F' },
  B: { name: '計画・実行力',      areas: 'スケジュールマネジメント × コストマネジメント',       color: '#1F6B4A' },
  C: { name: 'リスク・品質管理力', areas: 'リスクマネジメント × 品質マネジメント',             color: '#7A2A5A' },
  D: { name: '人を動かす力',      areas: '資源マネジメント × ステークホルダーマネジメント',     color: '#B06010' },
  E: { name: '情報・外部連携力',  areas: 'コミュニケーションマネジメント × 調達マネジメント',   color: '#4A3A8A' },
};

// シャッフル済み順序（A,C,E,B,D の交互配列）— 軸ラベルは回答中非表示
const QS = [
  { id:1,  ax:'A', t:'話し合いが長引いているとき、「結局、何のためにやるんだっけ」と整理したくなる' },
  { id:2,  ax:'C', t:'「これで本当に大丈夫か」と確認せずにはいられないことがよくある' },
  { id:3,  ax:'E', t:'グループで動くとき、誰が何を知っているかを自然と把握・整理したくなる' },
  { id:4,  ax:'B', t:'やると決めたら、具体的な手順や段取りを自然と考えてしまう' },
  { id:5,  ax:'D', t:'誰かと話していると、その人の得意なことや個性が自然と見えてくる' },
  { id:6,  ax:'A', t:'何かを始めるとき、「やらないこと」を先に決めないと落ち着かない' },
  { id:7,  ax:'D', t:'相手が何を期待しているか、言葉にされる前から察して動きたくなる' },
  { id:8,  ax:'B', t:'予定どおりに進んでいないと、早めに気づいて修正したくなる' },
  { id:9,  ax:'C', t:'まだ起きていないことでも、先の問題を想像して対策を考えてしまう' },
  { id:10, ax:'E', t:'集まりや打ち合わせの前に、「何のための時間か」を確認・設計したくなる' },
  { id:11, ax:'A', t:'計画が変わったとき、他への影響がすぐ気になって確認したくなる' },
  { id:12, ax:'B', t:'旅行や買い物でも、コストと手間のバランスを自然と考える' },
  { id:13, ax:'D', t:'意見が対立しているとき、話し合いで落としどころを見つけたくなる' },
  { id:14, ax:'E', t:'人と何かを一緒にするとき、お互いの役割や期待をはっきりさせたくなる' },
  { id:15, ax:'C', t:'問題が起きたとき、なぜそうなったかを突き止めずにいられない' },
  { id:16, ax:'A', t:'周りが迷っているとき、自然と「まずこれから」と方向を示したくなる' },
  { id:17, ax:'E', t:'足りないものがあると、外から人や知恵を借りるアイデアがすぐ浮かぶ' },
  { id:18, ax:'D', t:'グループの雰囲気や誰かの調子の変化に、いち早く気づいてしまう' },
  { id:19, ax:'B', t:'準備が足りないと感じると、早めに動いて備えておきたくなる' },
  { id:20, ax:'C', t:'予想外のことが起きても、慌てず「じゃあどうするか」と考えられる' },
];

const TYPES = {
  A: {
    name: 'ゴール設定型PM',
    desc: '曖昧な状況を整理し、チームに方向性を与えるのが自然な資質です。「何をやるか・やらないか」を言語化してコンセンサスを取ることに才能があります。StrengthsFinderでいう「戦略性」「着想」「分析思考」系の資質と重なります。プロジェクトの羅針盤タイプ。'
  },
  B: {
    name: '計画実行型PM',
    desc: '緻密な段取りを組んで着実に前進させることが自然な資質です。スケジュールとコストを同時に把握し、実行に落とし込む才能があります。StrengthsFinderでいう「実行力」「規律性」「目標志向」系の資質が光ります。チームの「実行の要」タイプ。'
  },
  C: {
    name: 'リスク予防型PM',
    desc: '問題を未然に防ぐ先読き力が自然な資質です。品質とリスクに敏感で、「起きる前に手を打つ」ことが自然にできます。StrengthsFinderでいう「慎重さ」「回復志向」「分析思考」系の資質を持つ、チームの「安全基地」タイプ。'
  },
  D: {
    name: 'ヒト型PM',
    desc: '人の状態や強みを察知し、動かして成果を生む力が自然な資質です。関係者を巻き込みながらプロジェクトを前に進めることに才能があります。StrengthsFinderでいう「個別化」「共感性」「コミュニケーション」系の資質が光ります。'
  },
  E: {
    name: '連携型PM',
    desc: '情報を流通させ、外部をつなぐことが自然な資質です。コミュニケーション設計と調達管理の才能で、社内外のネットワークをハブとして機能させます。StrengthsFinderでいう「アレンジ」「親密性」「コミュニケーション」系の資質と重なります。'
  },
};

function isDark() {
  const dt = document.documentElement.getAttribute('data-theme');
  if (dt === 'dark') return true;
  if (dt === 'light') return false;
  return window.matchMedia('(prefers-color-scheme: dark)').matches;
}

function updateProgress() {
  const answered = QS.filter(q => document.querySelector(`input[name="q${q.id}"]:checked`)).length;
  document.getElementById('progressText').textContent = `${answered} / ${QS.length}`;
  document.getElementById('progressFill').style.width = `${(answered / QS.length) * 100}%`;
}

function renderForm() {
  const wrap = document.getElementById('diagForm');
  let html = '';
  QS.forEach((q, idx) => {
    html += `<div class="q-card">
      <div class="q-num">Q${q.id}</div>
      <div class="q-text">${q.t}</div>
      <div class="radio-row">
        ${[1,2,3,4,5].map(v =>
          `<label class="rlabel"><input type="radio" name="q${q.id}" value="${v}"><div class="rbtn">${v}</div></label>`
        ).join('')}
      </div>
      <div class="radio-ends"><span>当てはまらない</span><span>とても自分らしい</span></div>
    </div>`;
  });
  wrap.innerHTML = html;

  // Progress update on any radio change
  wrap.addEventListener('change', updateProgress);
}

let chart = null;

function drawChart(scores) {
  const dark = isDark();
  const gridC  = dark ? 'rgba(180,205,250,.14)' : 'rgba(27,59,111,.1)';
  const labelC = dark ? '#C8D6F0' : '#1A2332';

  const ctx = document.getElementById('radarChart').getContext('2d');
  if (chart) { chart.destroy(); chart = null; }

  chart = new Chart(ctx, {
    type: 'radar',
    data: {
      labels: ['ゴール設定力', '計画・実行力', 'リスク・品質管理力', '人を動かす力', '情報・外部連携力'],
      datasets: [
        {
          label: '満点',
          data: [5,5,5,5,5],
          backgroundColor: 'transparent',
          borderColor: dark ? 'rgba(180,200,250,.2)' : 'rgba(27,59,111,.12)',
          borderDash: [5,4],
          borderWidth: 1,
          pointRadius: 0,
        },
        {
          label: 'あなたのスコア',
          data: ['A','B','C','D','E'].map(k => scores[k]),
          backgroundColor: 'rgba(27,59,111,.18)',
          borderColor: '#2A5EA0',
          pointBackgroundColor: '#1B3B6F',
          pointBorderColor: dark ? '#1A2535' : '#fff',
          pointBorderWidth: 2,
          pointRadius: 5,
          borderWidth: 2,
          fill: true,
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      animation: { duration: 900, easing: 'easeInOutQuart' },
      scales: {
        r: {
          min: 0, max: 5,
          ticks: { stepSize: 1, display: false },
          grid: { color: gridC },
          angleLines: { color: gridC },
          pointLabels: {
            font: { family: "'Noto Sans JP',sans-serif", size: 12, weight: '700' },
            color: labelC,
          }
        }
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: c => ` ${parseFloat(c.raw).toFixed(1)} / 5.0`
          }
        }
      }
    }
  });
}

function showResult(scores) {
  // Determine PM type (highest axis)
  let maxAx = 'A', maxV = 0;
  for (const [k,v] of Object.entries(scores)) {
    if (v > maxV) { maxV = v; maxAx = k; }
  }

  document.getElementById('typeName').textContent = TYPES[maxAx].name;
  document.getElementById('typeDesc').textContent  = TYPES[maxAx].desc;

  // Score rows
  const sl = document.getElementById('scoresList');
  sl.innerHTML = ['A','B','C','D','E'].map(k => {
    const ax = AXES[k];
    const pct = Math.round((scores[k] - 1) / 4 * 100);
    return `<div class="score-row">
      <div class="s-badge" style="background:${ax.color}">${k}</div>
      <div class="s-info">
        <div class="s-name">${ax.name}<span style="font-size:10.5px;font-weight:400;color:var(--text-muted);margin-left:6px;">${ax.areas}</span></div>
        <div class="s-bar-wrap"><div class="s-bar" id="bar-${k}" style="background:${ax.color}"></div></div>
      </div>
      <div class="s-val">${scores[k].toFixed(1)}</div>
    </div>`;
  }).join('');

  const result = document.getElementById('result');
  result.hidden = false;

  requestAnimationFrame(() => {
    result.scrollIntoView({ behavior: 'smooth', block: 'start' });
    drawChart(scores);
    setTimeout(() => {
      ['A','B','C','D','E'].forEach(k => {
        const bar = document.getElementById(`bar-${k}`);
        if (bar) bar.style.width = Math.round((scores[k]-1)/4*100) + '%';
      });
    }, 120);
  });
}

function diagnose() {
  const unanswered = [];
  const totals = { A:0, B:0, C:0, D:0, E:0 };
  const counts = { A:0, B:0, C:0, D:0, E:0 };

  for (const q of QS) {
    const el = document.querySelector(`input[name="q${q.id}"]:checked`);
    if (!el) { unanswered.push(q.id); }
    else {
      totals[q.ax] += parseInt(el.value);
      counts[q.ax]++;
    }
  }

  const errEl = document.getElementById('errMsg');
  if (unanswered.length > 0) {
    errEl.style.display = 'block';
    errEl.textContent = `Q${unanswered.join('・Q')} が未回答です。すべての問いに答えてから診断してください。`;
    const firstUn = document.querySelector(`input[name="q${unanswered[0]}"]`);
    if (firstUn) firstUn.closest('.q-card').scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  errEl.style.display = 'none';

  const scores = {};
  for (const k of ['A','B','C','D','E']) {
    scores[k] = counts[k] > 0 ? totals[k] / counts[k] : 0;
  }
  showResult(scores);
}

document.addEventListener('DOMContentLoaded', () => {
  renderForm();
  document.getElementById('btnDiagnose').addEventListener('click', diagnose);
  document.getElementById('btnReset').addEventListener('click', () => {
    document.querySelectorAll('input[type="radio"]').forEach(r => r.checked = false);
    document.getElementById('result').hidden = true;
    updateProgress();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
});
</script>
